<text x="1060" y="462" font-size="11.5" font-weight="400" fill="#a39b8a" text-anchor="start">coil S ← D5</text>
<text x="1060" y="478" font-size="11.5" font-weight="400" fill="#a39b8a" text-anchor="start">coil + BAT, − GND</text>
