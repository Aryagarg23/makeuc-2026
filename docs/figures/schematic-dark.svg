<text x="1060" y="342" font-size="11.5" font-weight="400" fill="#a39b8a" text-anchor="start">coil S ← D4</text>
<text x="1060" y="358" font-size="11.5" font-weight="400" fill="#a39b8a" text-anchor="start">coil + BAT, − GND</text>
