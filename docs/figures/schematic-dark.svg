<text x="1340" y="372" font-size="12" font-weight="400" fill="#d95526" text-anchor="middle">left mastoid</text>
<polyline points="1180,460 1328,460" fill="none" stroke="#d95526" stroke-width="1.5"/>
<circle cx="1340" cy="460" r="12" fill="#1c1c1c" stroke="#d95526" stroke-width="2"/>
<text x="1340" y="492" font-size="12" font-weight="400" fill="#d95526" text-anchor="middle">right mastoid</text>
<text x="1020" y="520" font-size="11.5" font-weight="400" fill="#a39b8a" text-anchor="start">A relay is energized one at a time.</text>
<text x="1020" y="536" font-size="11.5" font-weight="400" fill="#a39b8a" text-anchor="start">Relay 1 on: left → TOP, right → BOTTOM.</text>
<text x="1020" y="552" font-size="11.5" font-weight="400" fill="#a39b8a" text-anchor="start">Relay 2 on: right → TOP, left → BOTTOM.</text>
<text x="1020" y="568" font-size="11.5" font-weight="400" fill="#a39b8a" text-anchor="start">Both off: both electrodes on BOTTOM, no path.</text>
<rect x="40" y="560" width="380" height="108" fill="#1c1c1c" stroke="#f1ede4" stroke-width="1.5"/>
<text x="50" y="580" font-size="13" font-weight="500" fill="#f1ede4" text-anchor="start">How to read it</text>
<text x="50" y="596" font-size="11.5" font-weight="400" fill="#a39b8a" text-anchor="start">The firmware sets V_SET with D3. The LM358 drives Q2 until the</text>
<text x="50" y="612" font-size="11.5" font-weight="400" fill="#a39b8a" text-anchor="start">voltage on SENSE equals V_SET, so I = V_SET / 1.1 kΩ whatever</text>
<text x="50" y="628" font-size="11.5" font-weight="400" fill="#a39b8a" text-anchor="start">the head does, until HV runs out. HV − (TOP drop) − (SENSE</text>
<text x="50" y="644" font-size="11.5" font-weight="400" fill="#a39b8a" text-anchor="start">drop) − 0.2 V is all the head can have.</text>
</svg>
