<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Space Grotesk, Inter, system-ui, sans-serif" role="img" aria-labelledby="t">
<title id="t">HVAC software map: traffic from your devices to packet lines, the pipeline's names, windows, classify, rules, trigger and intensity, Bluetooth to the firmware and electrodes; TRIBE v2 at enrollment; fun mode</title>
<defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#282215" stroke-width="1.4"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#3b42db" stroke-width="1.4"/></marker><marker id="a-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#e85b30" stroke-width="1.4"/></marker></defs>
<rect width="1000" height="640" fill="#eae4d6"/>
<text x="40" y="30" font-size="10.5" letter-spacing="1.4" fill="#6b6250">HVAC · SOFTWARE MAP</text>
<rect x="40" y="50" width="150" height="70" fill="#eae4d6" stroke="#282215" stroke-width="1"/>
<text x="52" y="72" font-size="14" font-weight="500" fill="#282215">Your devices</text>
<text x="52" y="90" font-size="12" font-weight="400" fill="#6b6250">phone, laptop, …</text>
<text x="52" y="106" font-size="12" font-weight="400" fill="#6b6250">one Tailscale network</text>
<rect x="240" y="50" width="240" height="70" fill="#eae4d6" stroke="#282215" stroke-width="1"/>
<text x="252" y="72" font-size="14" font-weight="500" fill="#282215">Exit node</text>
<text x="252" y="90" font-size="12" font-weight="400" fill="#6b6250">UNO Q as a Tailscale exit node (plan),</text>
<text x="252" y="106" font-size="12" font-weight="400" fill="#6b6250">the Mac's tshark over USB (demo)</text>
<polyline points="190,85 240,85" fill="none" stroke="#282215" stroke-width="1.2" marker-end="url(#a-ink)"/>
<text x="215" y="77" font-size="11" fill="#282215" text-anchor="middle">traffic</text>
<rect x="530" y="50" width="170" height="70" fill="#eae4d6" stroke="#282215" stroke-width="1"/>
<text x="542" y="72" font-size="14" font-weight="500" fill="#282215">Packet lines</text>
<text x="542" y="90" font-size="12" font-weight="400" fill="#6b6250">tshark, one tab-separated</text>
<text x="542" y="106" font-size="12" font-weight="400" fill="#6b6250">line per packet</text>
<polyline points="480,85 530,85" fill="none" stroke="#282215" stroke-width="1.2" marker-end="url(#a-ink)"/>
<rect x="40" y="160" width="660" height="300" fill="#eae4d6" stroke="#282215" stroke-width="1" stroke-dasharray="4 4"/>
<text x="52" y="182" font-size="14" font-weight="500" fill="#282215">gvs_pipeline, pure Python, running on the UNO Q</text>
<polyline points="615,120 615,160" fill="none" stroke="#282215" stroke-width="1.2" marker-end="url(#a-ink)"/>
<rect x="60" y="200" width="190" height="74" fill="#eae4d6" stroke="#282215" stroke-width="1"/>
<text x="72" y="222" font-size="14" font-weight="500" fill="#282215">Names</text>
<text x="72" y="240" font-size="12" font-weight="400" fill="#6b6250">DNS answers, TLS SNI, HTTP Host</text>
<text x="72" y="256" font-size="12" font-weight="400" fill="#6b6250">→ service per IP</text>
<rect x="270" y="200" width="190" height="74" fill="#eae4d6" stroke="#282215" stroke-width="1"/>
<text x="282" y="222" font-size="14" font-weight="500" fill="#282215">Windows</text>
<text x="282" y="240" font-size="12" font-weight="400" fill="#6b6250">3 s long, sliding every 1 s</text>
<text x="282" y="256" font-size="12" font-weight="400" fill="#6b6250">under 5 kB/s never counts</text>
<rect x="480" y="200" width="200" height="74" fill="#eae4d6" stroke="#282215" stroke-width="1"/>
<text x="492" y="222" font-size="14" font-weight="500" fill="#282215">Classify</text>
<text x="492" y="240" font-size="12" font-weight="400" fill="#6b6250">enrolled domain, or shared domain</text>
<text x="492" y="256" font-size="12" font-weight="400" fill="#6b6250">by flow shape, or unnamed by shape</text>
<polyline points="250,237 270,237" fill="none" stroke="#282215" stroke-width="1.2" marker-end="url(#a-ink)"/>
<polyline points="460,237 480,237" fill="none" stroke="#282215" stroke-width="1.2" marker-end="url(#a-ink)"/>
<rect x="60" y="310" width="190" height="74" fill="#eae4d6" stroke="#282215" stroke-width="1"/>
<text x="72" y="332" font-size="14" font-weight="500" fill="#282215">Rules dashboard</text>
<text x="72" y="350" font-size="12" font-weight="400" fill="#6b6250">per app: Nauseate, Never, Auto</text>
<text x="72" y="366" font-size="12" font-weight="400" fill="#6b6250">weights, pause, key-locked</text>
<rect x="270" y="310" width="190" height="74" fill="#eae4d6" stroke="#282215" stroke-width="1"/>
<text x="282" y="332" font-size="14" font-weight="500" fill="#282215">Trigger</text>
<text x="282" y="350" font-size="12" font-weight="400" fill="#6b6250">same bucket 2 windows running,</text>
<text x="282" y="366" font-size="12" font-weight="400" fill="#6b6250">then 10 s quiet</text>
<rect x="480" y="310" width="200" height="74" fill="#eae4d6" stroke="#282215" stroke-width="1"/>
<text x="492" y="332" font-size="14" font-weight="500" fill="#282215">Intensity</text>
<text x="492" y="350" font-size="12" font-weight="400" fill="#6b6250">weight × max mA (≤ 2.0)</text>
<text x="492" y="366" font-size="12" font-weight="400" fill="#6b6250">1 Hz sine, whole cycles</text>
<polyline points="580,274 580,292 155,292 155,310" fill="none" stroke="#282215" stroke-width="1.2" marker-end="url(#a-ink)"/>
<polyline points="250,347 270,347" fill="none" stroke="#282215" stroke-width="1.2" marker-end="url(#a-ink)"/>
<polyline points="460,347 480,347" fill="none" stroke="#282215" stroke-width="1.2" marker-end="url(#a-ink)"/>
<text x="60" y="430" font-size="11.5" font-weight="400" fill="#6b6250" text-anchor="start">Enroll: a 2-minute recording of the thing to punish becomes a bucket (domains + flow shape, weight 0–1).</text>
<text x="60" y="448" font-size="11.5" font-weight="400" fill="#6b6250" text-anchor="start">Shared servers (Reels and DMs both use cdninstagram.com) are told apart by flow shape, or not at all.</text>
<rect x="760" y="160" width="220" height="70" fill="#eae4d6" stroke="#282215" stroke-width="1"/>
<text x="772" y="182" font-size="14" font-weight="500" fill="#282215">Bluetooth</text>
<text x="772" y="200" font-size="12" font-weight="400" fill="#6b6250">GATT, token on every command</text>
<text x="772" y="216" font-size="12" font-weight="400" fill="#6b6250">one connection at a time</text>
<polyline points="680,347 720,347 720,195 760,195" fill="none" stroke="#3b42db" stroke-width="1.2" marker-end="url(#a-blue)"/>
<text x="715" y="150" font-size="11" fill="#3b42db" text-anchor="middle">pulse ma ms hz pol sine</text>
<rect x="760" y="270" width="220" height="86" fill="#eae4d6" stroke="#282215" stroke-width="1"/>
<text x="772" y="292" font-size="14" font-weight="500" fill="#282215">XIAO firmware</text>
<text x="772" y="310" font-size="12" font-weight="400" fill="#6b6250">caps: 2.0 mA · 3 s · 5 s cooldown</text>
<text x="772" y="326" font-size="12" font-weight="400" fill="#6b6250">30 / hour · HV cutoff · readback trip</text>
<text x="772" y="342" font-size="12" font-weight="400" fill="#6b6250">refuses what the pipeline gets wrong</text>
<polyline points="870,230 870,270" fill="none" stroke="#3b42db" stroke-width="1.2" marker-end="url(#a-blue)"/>
<rect x="760" y="400" width="220" height="60" fill="#eae4d6" stroke="#e85b30" stroke-width="1"/>
<text x="772" y="422" font-size="14" font-weight="500" fill="#e85b30">Electrodes</text>
<text x="772" y="440" font-size="12" font-weight="400" fill="#6b6250">left and right mastoid</text>
<polyline points="870,356 870,400" fill="none" stroke="#e85b30" stroke-width="1.2" marker-end="url(#a-hot)"/>
<rect x="40" y="500" width="330" height="104" fill="#eae4d6" stroke="#282215" stroke-width="1"/>
<text x="52" y="522" font-size="14" font-weight="500" fill="#282215">TRIBE v2, on the GPU box, at enrollment only</text>
<text x="52" y="540" font-size="12" font-weight="400" fill="#6b6250">screen recording → predicted cortical drive</text>
<text x="52" y="556" font-size="12" font-weight="400" fill="#6b6250">placed between a neutral and a high anchor</text>
<text x="52" y="572" font-size="12" font-weight="400" fill="#6b6250">→ caps the bucket's weight, never raises it</text>
<polyline points="205,500 205,480 580,480 580,274" fill="none" stroke="#282215" stroke-width="1.2" marker-end="url(#a-ink)" stroke-dasharray="4 4"/>
<rect x="400" y="500" width="580" height="104" fill="#eae4d6" stroke="#282215" stroke-width="1"/>
<text x="412" y="522" font-size="14" font-weight="500" fill="#282215">Fun mode (the same board, a different driver)</text>
<text x="412" y="540" font-size="12" font-weight="400" fill="#6b6250">UNO Q hotspot arya-gvs → friends open a page on their phones → tilt slider</text>
<text x="412" y="556" font-size="12" font-weight="400" fill="#6b6250">UNO Q sends live mA over Bluetooth at 10 Hz; 0 mA after 1.5 s of silence (dead-man)</text>
<text x="412" y="572" font-size="12" font-weight="400" fill="#6b6250">the UNO Q LED matrix shows the tilt; the firmware's caps still apply</text>
<polyline points="980,552 990,552 990,430 980,430" fill="none" stroke="#3b42db" stroke-width="1.2" marker-end="url(#a-blue)"/>
</svg>
