<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Packet rules</title>
<style>
  :root {
    --bg: #fafafa; --panel: #ffffff; --ink: #141414; --muted: #8a8a8a; --line: #ececec;
    --accent: #e5484d; --accent-soft: #fdecec; --ok: #2f9e6e; --track: #e9e9e9;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111; --panel: #181818; --ink: #ededed; --muted: #8f8f8f; --line: #262626;
            --accent: #ff6369; --accent-soft: #3a1a1c; --ok: #4cc38a; --track: #2a2a2a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 20px 28px; border-bottom: 1px solid var(--line); }
  h1 { font-size: 17px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  .status { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
  .dot.paused { background: var(--muted); }
  .dot.stale { background: var(--accent); }
  .spacer { flex: 1; }
  button { font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
           padding: 6px 12px; border-radius: 8px; cursor: pointer; }
  button:hover { border-color: var(--muted); }
  button.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  main { display: grid; grid-template-columns: 1.3fr 1fr; gap: 20px; padding: 24px 28px; max-width: 1180px; margin: 0 auto; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; padding: 16px; } header { padding: 16px; } }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; }
  section + section { margin-top: 20px; }
  h2 { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin: 0 0 12px; }
  .row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 14px; align-items: center;
         padding: 12px 0; border-top: 1px solid var(--line); }
  .row:first-of-type { border-top: 0; }
  .name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sub { color: var(--muted); font-size: 12.5px; }
  .bar { height: 4px; background: var(--track); border-radius: 2px; overflow: hidden; margin-top: 6px; }
  .bar > i { display: block; height: 100%; background: var(--ink); opacity: 0.35; }
  .bar > i.hot { background: var(--accent); opacity: 1; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; padding: 5px 10px; background: transparent; color: var(--muted); }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: var(--ink); color: var(--bg); }
  .seg button.on.nausea { background: var(--accent); color: #fff; }
  .slider { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; }
  input[type=range] { flex: 1; accent-color: var(--accent); }
  .pct { width: 44px; text-align: right; font-variant-numeric: tabular-nums; font-size: 13px; }
  .chip { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--track); color: var(--muted); }
  .chip.hot { background: var(--accent-soft); color: var(--accent); }
  .empty { color: var(--muted); font-size: 13.5px; padding: 8px 0; }
  .add { display: flex; gap: 8px; margin-top: 12px; }
  .add input { flex: 1; font: inherit; font-size: 14px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px;
               background: var(--bg); color: var(--ink); }
  .toggle { position: relative; width: 36px; height: 20px; border-radius: 999px; background: var(--track); border: 0; padding: 0; }
  .toggle::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%;
                   background: #fff; transition: left .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
  .toggle.on { background: var(--accent); }
  .toggle.on::after { left: 18px; }
  .stim { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 13.5px; }
  .stim:first-of-type { border-top: 0; }
  .err { color: var(--accent); font-size: 13px; min-height: 18px; margin-top: 8px; }
  .x { border: 0; background: none; color: var(--muted); font-size: 18px; padding: 0 4px; }
</style>
</head>
<body>
<header>
  <h1>Packet rules</h1>
  <div class="status"><span class="dot" id="dot"></span><span id="status">connecting…</span></div>
  <div class="spacer"></div>
  <button id="pause">Pause</button>
</header>
<main>
  <div>
    <section>
      <h2>Traffic now</h2>
      <div id="now"></div>
    </section>
  </div>
  <div>
    <section>
      <h2>Nauseate on</h2>
      <div id="rules"></div>
      <form class="add" id="addform"><input id="addinput" placeholder="add a domain, e.g. tiktok.com" autocomplete="off">
        <button class="primary">Add</button></form>
      <div class="err" id="err"></div>
    </section>
    <section>
      <h2>Enrolled buckets</h2>
      <div id="buckets"></div>
    </section>
    <section>
      <h2>Last stimuli</h2>
      <div id="stims"></div>
    </section>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
let state = null, rules = null, dragging = false, sendTimer = null;
const KEY = new URLSearchParams(location.hash.slice(1)).get("key") || "";
const HDR = {"Content-Type": "application/json", "X-Dashboard-Key": KEY};
const DEFAULT_W = 0.6;

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c])); }
function pct(w) { return Math.round(w * 100) + "%"; }

async function refresh() {
  try {
    const r = await fetch("/api/state", {cache: "no-store", headers: HDR});
    if (r.status === 401) { $("status").textContent = "Locked: open the link with its #key"; $("dot").className = "dot stale"; return; }
    state = await r.json();
    if (!dragging && !sendTimer) rules = state.rules;
    render();
  } catch (e) {
    $("status").textContent = "not connected"; $("dot").className = "dot stale";
  }
}

function send() {
  clearTimeout(sendTimer);
  sendTimer = setTimeout(async () => {
    const r = await fetch("/api/rules", {method: "POST", headers: HDR, body: JSON.stringify(rules)});
    const body = await r.json();
    sendTimer = null;
    if (!r.ok) { $("err").textContent = body.error; return; }
    $("err").textContent = ""; state = body; rules = body.rules; render();
  }, 200);
}

function mode(service) {
  const w = rules.services[service];
  return w === undefined ? "auto" : (w === 0 ? "never" : "on");
}
function setMode(service, m) {
  if (m === "auto") delete rules.services[service];
  else rules.services[service] = m === "never" ? 0 : (rules.services[service] || DEFAULT_W);
  render(); send();
}

function seg(service) {
  const m = mode(service);
  return `<div class="seg" data-s="${esc(service)}">` +
    ["auto", "on", "never"].map(k => `<button data-m="${k}" class="${m === k ? "on" : ""} ${k === "on" ? "nausea" : ""}">` +
      `${{auto: "Auto", on: "Nauseate", never: "Never"}[k]}</button>`).join("") + `</div>`;
}

function render() {
  if (!state || !rules) return;
  const c = state.config, stale = state.window === null;
  $("dot").className = "dot" + (rules.paused ? " paused" : "");
  $("status").textContent = rules.paused ? "Paused: nothing fires" :
    (c.armed ? `Live, armed (max ${c.max_ma} mA)` : "Live, dry run (no device)") + (stale ? ", waiting for packets" : "");
  $("pause").textContent = rules.paused ? "Resume" : "Pause";

  const named = state.now.filter(r => r.named);
  const top = Math.max(1, ...state.now.map(r => r.kbps));
  const seenOnly = state.seen.filter(s => !named.some(r => r.service === s.service));
  $("now").innerHTML = (named.length + seenOnly.length === 0)
    ? `<div class="empty">No named traffic yet. Services appear here as packets arrive.</div>`
    : named.map(r => `<div class="row">
        <div><div class="name">${esc(r.service)}</div>
          <div class="sub">${r.kbps} kB/s ${r.intensity > 0 ? `<span class="chip hot">${r.via === "rule" ? "rule" : esc(r.bucket)} · ${pct(r.intensity)}</span>` : ""}</div>
          <div class="bar"><i class="${r.intensity > 0 ? "hot" : ""}" style="width:${Math.max(2, 100 * r.kbps / top)}%"></i></div></div>
        ${seg(r.service)}</div>`).join("") +
      seenOnly.map(s => `<div class="row"><div><div class="name">${esc(s.service)}</div>
          <div class="sub">quiet now · peak ${s.peak_kbps} kB/s</div></div>${seg(s.service)}</div>`).join("");

  const svc = Object.entries(rules.services);
  $("rules").innerHTML = svc.length === 0 ? `<div class="empty">No rules. Enrolled buckets decide on their own.</div>` :
    svc.map(([s, w]) => `<div class="row">
      <div><div class="name">${esc(s)}</div><div class="sub">${w === 0 ? "never nauseates" : "nauseates at " + pct(w)}</div></div>
      <button class="x" data-del="${esc(s)}" title="Remove rule">×</button>
      ${w > 0 ? `<div class="slider"><input type="range" min="5" max="100" step="5" value="${Math.round(w * 100)}" data-w="${esc(s)}"><span class="pct">${pct(w)}</span></div>` : ""}
    </div>`).join("");

  $("buckets").innerHTML = state.buckets.length === 0 ? `<div class="empty">None enrolled (python -m gvs_pipeline enroll …).</div>` :
    state.buckets.map(b => { const r = rules.buckets[b.name] || {on: true, weight: b.enrolled_weight};
      return `<div class="row"><div><div class="name">${esc(b.name)}</div><div class="sub">${esc(b.domains.join(", "))}</div></div>
        <button class="toggle ${r.on ? "on" : ""}" data-b="${esc(b.name)}" aria-label="on/off"></button>
        ${r.on ? `<div class="slider"><input type="range" min="0" max="100" step="5" value="${Math.round(r.weight * 100)}" data-bw="${esc(b.name)}"><span class="pct">${pct(r.weight)}</span></div>` : ""}
      </div>`; }).join("");

  $("stims").innerHTML = state.stims.length === 0 ? `<div class="empty">Nothing fired yet.</div>` :
    state.stims.map(s => `<div class="stim"><span>${esc(s.service)} <span class="sub">${esc(s.via === "rule" ? "rule" : s.bucket)}</span></span>
      <span class="sub">${pct(s.intensity)} · ${s.ms} ms · ${Math.max(0, Math.round(state.server_time - s.wall))} s ago${s.gvs ? " · " + esc(JSON.stringify(s.gvs)) : ""}</span></div>`).join("");
}

document.addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b || !rules) return;
  if (b.dataset.m) return setMode(b.parentElement.dataset.s, b.dataset.m);
  if (b.dataset.del) { delete rules.services[b.dataset.del]; render(); return send(); }
  if (b.dataset.b) { const n = b.dataset.b, bk = state.buckets.find(x => x.name === n);
    const r = rules.buckets[n] || {on: true, weight: bk.enrolled_weight}; rules.buckets[n] = {...r, on: !r.on}; render(); return send(); }
  if (b.id === "pause") { rules.paused = !rules.paused; render(); return send(); }
});
document.addEventListener("input", (e) => {
  const t = e.target; if (t.type !== "range") return;
  dragging = true; const w = Number(t.value) / 100;
  if (t.dataset.w) rules.services[t.dataset.w] = w;
  if (t.dataset.bw) rules.buckets[t.dataset.bw] = {on: true, weight: w};
  t.nextElementSibling.textContent = pct(w);
});
document.addEventListener("change", (e) => { if (e.target.type === "range") { dragging = false; send(); } });
$("addform").addEventListener("submit", (e) => {
  e.preventDefault(); const v = $("addinput").value.trim().toLowerCase(); if (!v) return;
  rules.services[v] = DEFAULT_W; $("addinput").value = ""; render(); send();
});
refresh(); setInterval(refresh, 1000);
</script>
</body>
</html>
